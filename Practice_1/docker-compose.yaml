services: 
  web: 
    image: nginx:latest 
    ports: 
      - "8080:80" 
    volumes: 
      - ./html:/usr/share/nginx/html 
    networks: 
      - webnet
  app: 
    image: my-app:latest 
    build: 
      context: ./app 
    ports: 
      - "5000:5000"
    environment:
      - ENV=production 
    networks: 
      - webnet
    depends_on: 
      - db
  db: 
    image: postgres:latest 
    environment: 
      POSTGRES_DB: mydatabase
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes: 
      - db-data:/var/lib/postgresql/data
    networks:
      - webnet
networks: 
  webnet:
volumes: 
  db-data: